<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Power BI Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .container {
            background: white;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        button {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .error-message {
            color: #d32f2f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
        
        .success-message {
            color: #388e3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }
        
        .eye-icon {
            cursor: pointer;
            float: right;
            margin-top: -35px;
            margin-right: 12px;
            color: #667eea;
            font-size: 18px;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Secure Access</h1>
        <p class="subtitle">Enter password to access Power BI Report</p>
        
        <form id="passwordForm">
            <div class="form-group">
                <label for="password">Password:</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Enter your password"
                    required
                >
                <span class="eye-icon" onclick="togglePassword()">👁️</span>
            </div>
            
            <button type="submit">Access Report</button>
            
            <div class="error-message" id="errorMessage">
                ❌ Incorrect password. Please try again.
            </div>
            
            <div class="success-message" id="successMessage">
                ✓ Password correct! Redirecting...
            </div>
        </form>
    </div>

    <script>
        // ===== CONFIGURATION =====
        // Change this password to your desired password
        const CORRECT_PASSWORD = "123456789";
        
        // Your Power BI link
        const POWERBI_LINK = "https://app.powerbi.com/view?r=eyJrIjoiZmJhMDI2NzUtNmE0ZS00NzY5LWI1ODEtMDc2ODFjYzdkZGI4IiwidCI6IjNkZmI3Mjk1LTI5NDAtNDg2Yy04NmQ2LWRmN2NiNzVmZThkMyIsImMiOjl9";
        
        // ===== END CONFIGURATION =====

        const form = document.getElementById('passwordForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const enteredPassword = passwordInput.value;
            
            // Clear previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Check password
            if (enteredPassword === CORRECT_PASSWORD) {
                successMessage.style.display = 'block';
                
                // Redirect to Power BI link after 2 seconds
                setTimeout(() => {
                    window.location.href = POWERBI_LINK;
                }, 2000);
            } else {
                errorMessage.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        });

        // Toggle password visibility
        function togglePassword() {
            const passwordField = document.getElementById('password');
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
            } else {
                passwordField.type = 'password';
            }
        }
    </script>
</body>
</html>
